{% extends "base.html" %}
{% block title %}DKIM Lookup — lookup4.me{% endblock %}
{% block content %}
<h1 class="page-title">{{ tool.name }}</h1>
<p class="page-desc">{{ tool.desc }}</p>
<section class="panel">
  <form id="dkim-form">
    <label for="domain">Domain</label>
    <div class="row">
      <input id="domain" name="domain" type="text" placeholder="example.com" required autocomplete="off">
      <button class="btn" type="submit">Detect selectors</button>
    </div>
    <p class="hint">Checks a broad common-selector list. If a selector uses a CNAME/host, resolution continues until an IP is found.</p>
  </form>
  <div id="results" class="results"></div>
</section>
{% endblock %}
