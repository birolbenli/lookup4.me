{% extends "base.html" %}
{% block title %}MX Lookup — lookup4.me{% endblock %}
{% block content %}
<h1 class="page-title">{{ tool.name }}</h1>
<p class="page-desc">{{ tool.desc }}</p>
<section class="panel">
  <form id="mx-form">
    <label for="domain">Domain</label>
    <div class="row">
      <input id="domain" name="domain" type="text" placeholder="example.com" required autocomplete="off">
      <button class="btn" type="submit">Lookup</button>
    </div>
  </form>
  <div id="results" class="results"></div>
</section>
{% endblock %}
