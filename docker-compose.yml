services:
  lookup4me:
    build: .
    container_name: lookup4me
    ports:
      - "8080:8080"
      # Bind public IP only — host exim often holds 127.0.0.1:25
      - "104.247.164.215:25:2525"
    environment:
      - FLASK_ENV=production
      - BUYMEACOFFEE_URL=${BUYMEACOFFEE_URL:-https://buymeacoffee.com/birolbenli}
      - LINKEDIN_URL=${LINKEDIN_URL:-https://tr.linkedin.com/in/birolbenli}
      - MAILTEST_DOMAIN=${MAILTEST_DOMAIN:-tools.birolbenli.com}
      - MAILTEST_INBOX_HOURS=${MAILTEST_INBOX_HOURS:-24}
      - MAILTEST_REPORT_DAYS=${MAILTEST_REPORT_DAYS:-7}
      - MAILTEST_SMTP_ENABLED=1
      - MAILTEST_SMTP_HOST=0.0.0.0
      - MAILTEST_SMTP_PORT=2525
      - FEEDBACK_TO=${FEEDBACK_TO:-birolbenli@gmail.com}
      - FEEDBACK_FROM=${FEEDBACK_FROM:-noreply@tools.birolbenli.com}
      - FEEDBACK_HELO=${FEEDBACK_HELO:-tools.birolbenli.com}
      - RATE_LIMIT_MAILTEST=${RATE_LIMIT_MAILTEST:-5}
      - RATE_LIMIT_TOOLS=${RATE_LIMIT_TOOLS:-10}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-}
      - FORCE_HTTPS=${FORCE_HTTPS:-1}
      - HEAVY_CONCURRENCY=${HEAVY_CONCURRENCY:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-6}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-90}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-120}
    volumes:
      - lookup4me_data:/app/instance
    restart: unless-stopped
    mem_limit: 300m
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 2
      start_period: 25s

  # Restarts containers that stay unhealthy (Docker does not do this by itself).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: lookup4me-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=20
      - AUTOHEAL_START_PERIOD=40
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 48m

volumes:
  lookup4me_data:
