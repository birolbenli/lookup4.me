services:
  lookup4me:
    build: .
    container_name: lookup4me
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - BUYMEACOFFEE_URL=${BUYMEACOFFEE_URL:-https://buymeacoffee.com/birolbenli}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
